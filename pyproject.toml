[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabpfn-client"
version = "0.5.1"
requires-python = ">=3.10"

description = "API access for TabPFN: Foundation model for tabular data"
classifiers = [
  'Intended Audience :: Science/Research',
  'Intended Audience :: Developers',
  'License :: OSI Approved :: Apache Software License',
  'Programming Language :: Python',
  'Topic :: Software Development',
  'Topic :: Scientific/Engineering',
  'Operating System :: POSIX',
  'Operating System :: Unix',
  'Operating System :: MacOS',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
]
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.25.0,<=0.28.1",
    "omegaconf>=2.1.2,<=2.3.0",
    "pandas>=2.1.2,<=2.3.3",
    "password-strength>=0.0.3.post2,<=0.0.3.post2",
    "pydantic>=2.11.7,<=2.13.4",
    "scikit-learn>=1.3.1,<=1.9.0",
    "sseclient-py>=1.8.0,<=1.9.0",
    "tqdm>=4.63.0,<=4.70.0",
    "typing_extensions>=4.12.2,<=4.16.0",
    "xxhash>=1.1.0,<=3.8.1",
    "backoff>=2.2.0,<=2.2.1",
    "rich>=13.7.0,<=15.0.0",
    "tabpfn-common-utils>=0.2.10,<=0.2.19",
    "google-crc32c>=1.5.0,<=1.8.0",
    "pyarrow>=14.0.0,<=25.0.1",
    "pydantic-settings>=2.14.2,<=2.15.0",
]

[project.optional-dependencies]
sagemaker = ["boto3>=1.34"]
viz = [
    "matplotlib>=3.6.1,<=3.11.1",
    "scipy>=1.11.1,<=1.16.2",
]

[project.urls]
documentation = "https://priorlabs.ai/docs"
source = "https://github.com/priorlabs/tabpfn-client"

[tool.hatch.build.targets.wheel]
exclude = ["tabpfn_client/.tabpfn", "models_diff"]

[tool.hatch.build.targets.sdist]
exclude = ["tabpfn_client/.tabpfn", "models_diff"]

[tool.ruff]
exclude = [
    "experiments_*"
]

[tool.pytest.ini_options]
norecursedirs = [
    "experiments_*",
]

[dependency-groups]
dev = [
    "matplotlib>=3.6.1,<=3.11.1",
    "respx==0.23.1",
    "pytest==9.0.3",
    "ruff==0.15.21",
    "licensecheck==2025.1.0",
    "basedpyright~=1.39.9",
    "scipy>=1.11.1,<=1.16.2",
]

[tool.changelog-bot.towncrier_changelog]
enabled = true
changelog_skip_label = "no changelog needed"

[tool.towncrier]
directory = "changelog"
filename = "CHANGELOG.md"
start_string = "## [Unreleased]\n"
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/PriorLabs/tabpfn-client/pull/{issue})"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.section]]
path = ""
name = ""
