name: Release to PyPI
run-name: "publish ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    if: github.repository == 'PriorLabs/tabpfn-client'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version from tag
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?(\.post[0-9]+)?$' || {
            echo "Tag $TAG_NAME does not carry a valid release version"
            exit 1
          }

          if printf '%s' "$VERSION" | grep -Eq '(a|b|rc)[0-9]+$'; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          {
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Releasing $VERSION (prerelease: $PRERELEASE)"

      - name: Verify tag matches pyproject.toml
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag_version = os.environ["VERSION"]
          text = Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(
              r'(?ms)^\[project\]\s*\n.*?^\s*version\s*=\s*"([^"]+)"', text
          )
          if not match:
              raise SystemExit("Could not find [project].version in pyproject.toml")

          file_version = match.group(1).strip()
          if tag_version != file_version:
              raise SystemExit(
                  f"Version mismatch: tag={tag_version} pyproject={file_version}"
              )
          print("Tag matches pyproject version:", tag_version)
          PY

      # No cache anywhere on the release path. A restorable cache is writable
      # by anything else that runs in this repository, and this job produces the
      # artifact that reaches PyPI. setup-uv's default already skips the cache
      # on tag pushes; saying so is what keeps that true.
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Build sdist and wheel
        run: |
          rm -rf dist
          uv build

      - name: Extract release notes from CHANGELOG.md
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")

          pattern = (
              rf"(?ms)^##\s+\[{re.escape(version)}\]\s+-\s+"
              rf"\d{{4}}-\d{{2}}-\d{{2}}\s*\n(.*?)(?=^##\s+\[|\Z)"
          )
          match = re.search(pattern, text)
          if not match:
              raise SystemExit(
                  f"No changelog section for {version} in CHANGELOG.md"
              )

          Path("release_notes.md").write_text(
              match.group(1).strip() + "\n", encoding="utf-8"
          )
          print("Wrote release_notes.md")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release_notes
          path: release_notes.md
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.repository == 'PriorLabs/tabpfn-client'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/tabpfn-client/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Trusted publishing over OIDC. There is no API token to leak, and the
      # PyPI side is bound to this repository, this workflow file, and the
      # environment named above.
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
          skip-existing: true

  # Installing the release runs its dependencies' code, so this job holds no
  # token at all: no OIDC, no GITHUB_TOKEN, and no cache that a later job
  # could restore.
  verify-testpypi:
    name: Verify the TestPyPI release
    if: github.repository == 'PriorLabs/tabpfn-client'
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      # TestPyPI supplies exactly one package, ours, and never a dependency:
      # names go unclaimed on that index, and whoever claims one first decides
      # what gets installed here.
      - name: Install from TestPyPI and verify the version
        run: |
          workdir="$(mktemp -d)"
          cd "$workdir"
          uv venv

          # Retry rather than probe the index first: a probe and uv's own
          # resolution are separate requests, and TestPyPI can answer them from
          # different caches, so a probe that succeeds proves nothing about the
          # request that follows it. --refresh-package covers uv's local cache;
          # the loop covers the rest.
          for attempt in $(seq 1 30); do
            if uv pip install \
              --index-url https://test.pypi.org/simple/ \
              --no-deps \
              --refresh-package tabpfn-client \
              "tabpfn-client==${VERSION}"; then
              echo "Installed on attempt ${attempt}"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "tabpfn-client==${VERSION} never became installable from TestPyPI"
              exit 1
            fi
            echo "  not installable yet (attempt ${attempt}/30), retrying"
            sleep 10
          done

          .venv/bin/python - <<'PY' > requirements.txt
          from importlib.metadata import requires

          for requirement in requires("tabpfn-client") or []:
              base, _, marker = requirement.partition(";")
              if "extra ==" in marker:
                  continue
              print(base.strip())
          PY

          echo "Resolving dependencies from PyPI only:"
          cat requirements.txt

          uv pip install --index-url https://pypi.org/simple/ -r requirements.txt

          VERSION="$VERSION" .venv/bin/python - <<'PY'
          import os

          import tabpfn_client

          expected = os.environ["VERSION"]
          assert tabpfn_client.__version__ == expected, (
              f"expected {expected!r}, got {tabpfn_client.__version__!r}"
          )
          print("Installed tabpfn_client.__version__ ==", tabpfn_client.__version__)
          PY

  publish-pypi:
    name: Publish to PyPI
    if: github.repository == 'PriorLabs/tabpfn-client'
    needs: [build, verify-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tabpfn-client/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # No skip-existing here: on the real index a version that is already
      # present means the release is not what this run built, and the run must
      # stop rather than go on to cut a GitHub release for it.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true

  # The index users actually install from, exercised the way they install from
  # it: a plain `pip install tabpfn-client==<version>` resolving every
  # dependency from PyPI. Nothing can be unpublished by the time this runs, so
  # a failure here is a signal to yank, not a gate -- but it is the difference
  # between finding out now and finding out from a bug report.
  #
  # Installing runs the dependencies' own code, so this job holds no token:
  # no OIDC, no GITHUB_TOKEN, and no cache a later job could restore.
  verify-pypi:
    name: Verify the PyPI release
    if: github.repository == 'PriorLabs/tabpfn-client'
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Install from PyPI and smoke test
        run: |
          workdir="$(mktemp -d)"
          cd "$workdir"
          uv venv

          # Same retry as the TestPyPI check: a just-uploaded file is not
          # immediately consistent across the index's caches.
          for attempt in $(seq 1 30); do
            if uv pip install \
              --refresh-package tabpfn-client \
              "tabpfn-client==${VERSION}"; then
              echo "Installed on attempt ${attempt}"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "tabpfn-client==${VERSION} never became installable from PyPI"
              exit 1
            fi
            echo "  not installable yet (attempt ${attempt}/30), retrying"
            sleep 10
          done

          VERSION="$VERSION" .venv/bin/python - <<'PY'
          import os

          import tabpfn_client
          from tabpfn_client import TabPFNClassifier, TabPFNRegressor

          expected = os.environ["VERSION"]
          assert tabpfn_client.__version__ == expected, (
              f"expected {expected!r}, got {tabpfn_client.__version__!r}"
          )

          # The documented surface, so a packaging change that drops a module
          # fails here rather than for a user.
          for name in (
              "init",
              "reset",
              "get_access_token",
              "set_access_token",
              "get_api_usage",
              "interactive_login",
              "TabPFNClassifier",
              "TabPFNRegressor",
              "UserDataClient",
          ):
              assert hasattr(tabpfn_client, name), f"missing from public API: {name}"

          # Constructing an estimator touches no network and no credentials.
          TabPFNClassifier()
          TabPFNRegressor()

          print("Smoke test passed for", tabpfn_client.__version__)
          PY

  github-release:
    name: Create the GitHub release
    if: github.repository == 'PriorLabs/tabpfn-client'
    needs: [build, verify-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      # Checkout comes first: it cleans the workspace, so anything downloaded
      # ahead of it is deleted before the release can be attached.
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release_notes
          path: .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG=""
          fi

          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release_notes.md \
            --verify-tag \
            $PRERELEASE_FLAG \
            dist/*
